services:
  llm2rm:
    image: ghcr.io/steinidavid/llm_to_remarkable:latest
    ports:
      - "3020:3020"
    volumes:
      - llm2rm_config:/home/nodeapp/.config
    environment:
      - PORT=3020
      - RMAPI_CONFIG=/home/nodeapp/.config/.rmapi
    # Increase shared memory for Puppeteer/Chromium
    shm_size: '2gb'
volumes:
  llm2rm_config:
